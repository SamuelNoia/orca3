<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Fluxo: planilhas dos fornecedores, catálogo, orçamento e documento final">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4e78"/>
      <stop offset="1" stop-color="#2f5597"/>
    </linearGradient>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#9fb6d8"/>
    </marker>
  </defs>

  <rect width="960" height="300" rx="14" fill="url(#bg)"/>

  <text x="48" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b9cde8" letter-spacing="3">GESTÃO DE ORÇAMENTOS</text>
  <text x="48" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Central de Orçamentos</text>
  <text x="48" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cfdcec">Das planilhas dos fornecedores à proposta pronta para o cliente.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="48" y="168" width="176" height="86" rx="10" fill="#ffffff" opacity="0.10"/>
      <rect x="48" y="168" width="176" height="86" rx="10" fill="none" stroke="#7d9bc4"/>
      <text x="136" y="200" font-size="12" fill="#9fb6d8" text-anchor="middle">1</text>
      <text x="136" y="220" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Planilhas</text>
      <text x="136" y="238" font-size="11.5" fill="#b9cde8" text-anchor="middle">de cada fornecedor</text>
    </g>

    <line x1="230" y1="211" x2="252" y2="211" stroke="#9fb6d8" stroke-width="2" marker-end="url(#seta)"/>

    <g>
      <rect x="258" y="168" width="176" height="86" rx="10" fill="#ffffff" opacity="0.10"/>
      <rect x="258" y="168" width="176" height="86" rx="10" fill="none" stroke="#7d9bc4"/>
      <text x="346" y="200" font-size="12" fill="#9fb6d8" text-anchor="middle">2</text>
      <text x="346" y="220" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Catálogo</text>
      <text x="346" y="238" font-size="11.5" fill="#b9cde8" text-anchor="middle">produtos e preços</text>
    </g>

    <line x1="440" y1="211" x2="462" y2="211" stroke="#9fb6d8" stroke-width="2" marker-end="url(#seta)"/>

    <g>
      <rect x="468" y="168" width="176" height="86" rx="10" fill="#ffffff" opacity="0.10"/>
      <rect x="468" y="168" width="176" height="86" rx="10" fill="none" stroke="#7d9bc4"/>
      <text x="556" y="200" font-size="12" fill="#9fb6d8" text-anchor="middle">3</text>
      <text x="556" y="220" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Orçamento</text>
      <text x="556" y="238" font-size="11.5" fill="#b9cde8" text-anchor="middle">margem e despesas</text>
    </g>

    <line x1="650" y1="211" x2="672" y2="211" stroke="#9fb6d8" stroke-width="2" marker-end="url(#seta)"/>

    <g>
      <rect x="678" y="168" width="234" height="86" rx="10" fill="#ffffff"/>
      <text x="795" y="200" font-size="12" fill="#5a708c" text-anchor="middle">4</text>
      <text x="795" y="221" font-size="13.5" font-weight="700" fill="#1f4e78" text-anchor="middle">XLSX e PDF</text>
      <text x="795" y="239" font-size="11.5" fill="#5a708c" text-anchor="middle">proposta pronta para enviar</text>
    </g>
  </g>
</svg>
