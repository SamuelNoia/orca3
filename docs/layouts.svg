<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Os cinco layouts de orçamento disponíveis">
  <rect width="960" height="250" fill="#f4f6fa"/>

  <text x="48" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f4e78">5 layouts de orçamento</text>
  <text x="48" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5a6a7e">Cada fornecedor escolhe o seu no cadastro.</text>

  <!-- Classico -->
  <g transform="translate(48,84)">
    <rect width="168" height="130" rx="8" fill="#ffffff" stroke="#e2e8f1"/>
    <rect x="12" y="12" width="144" height="26" rx="3" fill="#1f4e78"/>
    <text x="84" y="29" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">ORÇAMENTO</text>
    <rect x="12" y="48" width="144" height="14" fill="#2f5597"/>
    <g fill="#e8eef7">
      <rect x="12" y="68" width="144" height="10"/><rect x="12" y="82" width="144" height="10"/>
      <rect x="12" y="96" width="144" height="10"/>
    </g>
    <rect x="12" y="110" width="144" height="12" fill="#1f4e78" opacity="0.85"/>
    <text x="84" y="146" font-family="Segoe UI, Arial" font-size="9.5" font-weight="600" fill="#1f4e78" text-anchor="middle">Clássico</text>
    <text x="84" y="158" font-family="Segoe UI, Arial" font-size="7.5" fill="#5a6a7e" text-anchor="middle">Segoe UI 9</text>
  </g>

  <!-- Moderno -->
  <g transform="translate(234,84)">
    <rect width="168" height="130" rx="8" fill="#ffffff" stroke="#e2e8f1"/>
    <text x="14" y="30" font-family="Calibri, Arial" font-size="12" font-weight="700" fill="#1a1a1a">ORÇAMENTO</text>
    <rect x="12" y="40" width="144" height="16" fill="#ededed"/>
    <g stroke="#d0d0d0">
      <line x1="12" y1="72" x2="156" y2="72"/><line x1="12" y1="90" x2="156" y2="90"/>
      <line x1="12" y1="108" x2="156" y2="108"/><line x1="12" y1="120" x2="156" y2="120"/>
    </g>
    <text x="84" y="146" font-family="Calibri, Arial" font-size="9.5" font-weight="600" fill="#1a1a1a" text-anchor="middle">Moderno</text>
    <text x="84" y="158" font-family="Calibri, Arial" font-size="7.5" fill="#5a6a7e" text-anchor="middle">Calibri 11</text>
  </g>

  <!-- Compacto -->
  <g transform="translate(420,84)">
    <rect width="168" height="130" rx="8" fill="#ffffff" stroke="#e2e8f1"/>
    <text x="14" y="26" font-family="'Arial Narrow', Arial" font-size="9" font-weight="700" fill="#000000">ORÇAMENTO</text>
    <line x1="12" y1="32" x2="156" y2="32" stroke="#000000"/>
    <g stroke="#000000" stroke-width="0.6">
      <line x1="12" y1="52" x2="156" y2="52"/><line x1="12" y1="62" x2="156" y2="62"/>
      <line x1="12" y1="72" x2="156" y2="72"/><line x1="12" y1="82" x2="156" y2="82"/>
      <line x1="12" y1="92" x2="156" y2="92"/><line x1="12" y1="102" x2="156" y2="102"/>
      <line x1="12" y1="112" x2="156" y2="112"/><line x1="12" y1="122" x2="156" y2="122"/>
    </g>
    <text x="84" y="146" font-family="'Arial Narrow', Arial" font-size="9.5" font-weight="600" fill="#000000" text-anchor="middle">Compacto</text>
    <text x="84" y="158" font-family="'Arial Narrow', Arial" font-size="7.5" fill="#5a6a7e" text-anchor="middle">Arial Narrow 8</text>
  </g>

  <!-- Formal -->
  <g transform="translate(606,84)">
    <rect width="168" height="130" rx="8" fill="#ffffff" stroke="#e2e8f1"/>
    <rect x="12" y="12" width="144" height="24" rx="2" fill="#404040"/>
    <text x="84" y="28" font-family="'Times New Roman', Georgia, serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ORÇAMENTO</text>
    <rect x="12" y="46" width="144" height="12" fill="#e7e6e6"/>
    <g stroke="#808080" fill="none">
      <rect x="12" y="64" width="144" height="58"/>
    </g>
    <g stroke="#808080" stroke-width="0.5">
      <line x1="12" y1="78" x2="156" y2="78"/><line x1="12" y1="92" x2="156" y2="92"/>
      <line x1="12" y1="106" x2="156" y2="106"/>
    </g>
    <text x="84" y="146" font-family="'Times New Roman', Georgia, serif" font-size="9.5" font-weight="600" fill="#404040" text-anchor="middle">Formal</text>
    <text x="84" y="158" font-family="'Times New Roman', Georgia, serif" font-size="7.5" fill="#5a6a7e" text-anchor="middle">Times New Roman 10</text>
  </g>

  <!-- Executivo -->
  <g transform="translate(792,84)">
    <rect width="120" height="130" rx="8" fill="#ffffff" stroke="#e2e8f1"/>
    <rect x="10" y="12" width="100" height="26" rx="2" fill="#1f6f5c"/>
    <text x="60" y="29" font-family="Verdana, Arial" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">ORÇAMENTO</text>
    <rect x="10" y="48" width="100" height="13" fill="#2e8b70"/>
    <g fill="#e3f1ec">
      <rect x="10" y="68" width="100" height="10"/><rect x="10" y="82" width="100" height="10"/>
      <rect x="10" y="96" width="100" height="10"/>
    </g>
    <rect x="10" y="110" width="100" height="12" fill="#1f6f5c" opacity="0.85"/>
    <text x="60" y="146" font-family="Verdana, Arial" font-size="9" font-weight="600" fill="#1f6f5c" text-anchor="middle">Executivo</text>
    <text x="60" y="158" font-family="Verdana, Arial" font-size="7" fill="#5a6a7e" text-anchor="middle">Verdana 9</text>
  </g>
</svg>
