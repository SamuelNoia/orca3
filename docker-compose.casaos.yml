# =====================================================================
#  Central de Orcamentos - variante para CasaOS / ZimaOS
#
#  Por que este arquivo e diferente do docker-compose.yml:
#  o CasaOS nao executa "build:". Ele apenas baixa imagens prontas.
#  Entao aqui usamos a imagem oficial "node:24-alpine" (que existe no
#  Docker Hub) e montamos o codigo da aplicacao como volume.
#  Nao precisa construir imagem nem publicar em registry.
#
#  ANTES DE INSTALAR: copie os arquivos do projeto para
#     /DATA/AppData/orcamentos/app
#  (use o pacote-casaos.zip e descompacte nessa pasta)
#
#  Depois: CasaOS > Apps > + Instalar > Importar / Colar YAML
# =====================================================================
services:
  orcamentos:
    image: node:24-alpine
    container_name: orcamentos
    restart: unless-stopped

    ports:
      - "3088:3000"

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      NODE_ENV: production
      TZ: America/Sao_Paulo
      # primeiro acesso: a senha e gerada automaticamente na 1a execucao
      # e gravada em /DATA/AppData/orcamentos/data/PRIMEIRO_ACESSO.txt
      ADMIN_EMAIL: admin@empresa.local
      # descomente para definir uma senha fixa em vez da aleatoria
      # ADMIN_PASSWORD: troque-esta-senha

    working_dir: /app

    volumes:
      # codigo da aplicacao (nao editar aqui)
      - /DATA/AppData/orcamentos/app:/app
      # banco SQLite e planilhas temporarias (backup desta pasta)
      - /DATA/AppData/orcamentos/data:/app/data

    command:
      - sh
      - -c
      - |
        if [ ! -f /app/server.js ]; then
          echo "================================================================"
          echo " CODIGO NAO ENCONTRADO"
          echo ""
          echo " Copie os arquivos do projeto para:"
          echo "   /DATA/AppData/orcamentos/app"
          echo ""
          echo " expected: server.js, src/, public/, tools/, package.json"
          echo " Use o pacote-casaos.zip e descompacte nessa pasta."
          echo " Depois reinicie este aplicativo no CasaOS."
          echo "================================================================"
          while true; do sleep 3600; done
        fi
        if [ ! -f /app/data/orcamentos.db ]; then
          echo "[init] banco novo: criando base inicial com produto de teste"
          node tools/seed-inicial.js || true
        fi
        echo "[init] iniciando servidor na porta ${PORT:-3000}"
        exec node server.js

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
